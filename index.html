<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayliz Scents | Luxury Perfume Atelier</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;900&display=swap" rel="stylesheet">
</head>
<body class="bg-[#f4f6f9] text-[#1e2530] font-['Quicksand'] antialiased overflow-x-hidden">

    <div id="intro-overlay">
        <div class="text-center flex flex-col items-center">
            <h1 class="intro-text text-white text-4xl md:text-6xl font-black tracking-widest border-r-4 border-[#dfb76c] inline-block whitespace-nowrap overflow-hidden animate-blink">AYLIZ SCENTS</h1>
            <p class="text-gray-200 mt-4 text-base md:text-lg font-bold tracking-wide">Discover your signature luxury fragrance</p>
        </div>
    </div>

    <header class="flex flex-col sm:flex-row justify-between items-center padding-responsive bg-white shadow-md shadow-[#1e2530]/5 gap-4">
        <div class="text-2xl font-black tracking-wider bg-gradient-to-r from-[#6b0f24] to-[#0f2b46] bg-clip-text text-transparent">AYLIZ SCENTS</div>
        <nav class="flex gap-4 w-full sm:w-auto justify-center">
            <a href="https://www.instagram.com/ayliz.dev" target="_blank" class="no-underline text-white bg-gradient-to-r from-[#f9ce34] via-[#ee2a7b] to-[#6228d7] px-4 py-2 rounded-full font-bold text-sm transition-all duration-300 hover:-translate-y-0.5 hover:shadow-lg">
                <i class="fab fa-instagram"></i> Instagram
            </a>
            <a href="https://wa.me/905xxxxxxxxx" target="_blank" class="no-underline text-white bg-[#1cbd55] px-4 py-2 rounded-full font-bold text-sm transition-all duration-300 hover:-translate-y-0.5 hover:shadow-lg">
                <i class="fab fa-whatsapp"></i> Order WhatsApp
            </a>
        </nav>
    </header>

    <main class="padding-responsive py-10">
        <div class="filter-buttons flex justify-start md:justify-center gap-3 mb-12 overflow-x-auto whitespace-nowrap pb-3 -mx-5 px-5 sm:mx-0 sm:px-0 scrollbar-none">
            <button class="filter-btn active" onclick="filterProducts('all')">✨ All Perfumes</button>
            <button class="filter-btn" onclick="filterProducts('floral')">🌸 Floral & Sweet</button>
            <button class="filter-btn" onclick="filterProducts('woody')">🌲 Woody & Spicy</button>
            <button class="filter-btn" onclick="filterProducts('fresh')">🌊 Fresh & Citrus</button>
        </div>

        <div id="product-list" class="product-grid"></div>
    </main>

    <div id="productModal" class="modal fixed inset-0 hidden bg-[#0f2b46]/70 backdrop-blur-sm z-[11000]">
        <div class="bg-white my-[20%] sm:my-[8%] mx-auto p-6 sm:p-8 w-[92%] max-w-[750px] rounded-[25px] border-3 border-[#6b0f24] relative animate-slideUp">
            <span class="close-modal absolute right-6 top-4 text-3xl cursor-pointer text-gray-400 hover:text-[#6b0f24] transition-colors">&times;</span>
            <div class="flex flex-col md:flex-row gap-6 mt-4">
                <img id="modalImage" class="w-full md:max-w-[320px] h-[220px] md:h-[320px] object-cover rounded-[18px] border border-gray-100" src="" alt="Perfume Detail">
                <div class="flex-1 flex flex-col justify-center">
                    <h2 id="modalName" class="text-2xl md:text-3xl font-black text-[#6b0f24] mb-3">Perfume Name</h2>
                    <p id="modalDesc" class="text-gray-600 text-sm md:text-base leading-relaxed mb-4">Description goes here...</p>
                    <span id="modalPrice" class="text-2xl font-black text-[#0f2b46] mb-5">0.00 $</span>
                    <a id="modalWhatsApp" href="" class="block p-4 bg-[#6b0f24] hover:bg-[#0f2b46] text-white text-center font-bold text-lg rounded-[15px] no-underline transition-all duration-300 hover:-translate-y-0.5 shadow-md" target="_blank">
                        <i class="fab fa-whatsapp"></i> Order via WhatsApp
                    </a>
                </div>
            </div>
        </div>
    </div>

    <footer class="p-10 text-center bg-white mt-20 border-t-2 border-[#6b0f24]/10">
        <p class="text-sm font-bold mb-4">By Designer <strong>AylizDev</strong></p>
        <div class="flex justify-center gap-6">
            <a href="https://www.linkedin.com/in/ayliz-azaklı-74579b318/" target="_blank" class="text-2xl text-gray-400 hover:text-[#0077b5] transition-all hover:-translate-y-1"><i class="fab fa-linkedin"></i></a>
            <a href="https://github.com/merveayliz" target="_blank" class="text-2xl text-gray-400 hover:text-black transition-all hover:-translate-y-1"><i class="fab fa-github"></i></a>
            <a href="https://www.instagram.com/ayliz.dev" target="_blank" class="text-2xl text-gray-400 hover:text-[#e1306c] transition-all hover:-translate-y-1"><i class="fab fa-instagram"></i></a>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
